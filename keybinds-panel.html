<div id="keybindPanel" class="overlay" role="dialog" aria-modal="true" aria-labelledby="keybindTitle" style="display:none;">
    <div class="modal-panel keybind-panel">
        <div class="modal-header">
            <h2 id="keybindTitle">🔁 Rebind Keys</h2>
            <button id="closeKeybinds" class="close-btn" aria-label="Close Keybinds">✕</button>
        </div>
        <div class="modal-content">
            <p>Click an action, then press the desired key.</p>
            <div class="keybind-list">
                <div class="keybind-row" data-action="moveUp">
                    <span class="action-label">Move Up</span>
                    <button class="keybind-btn"> <span class="key-display">W</span> </button>
                </div>
                <div class="keybind-row" data-action="moveLeft">
                    <span class="action-label">Move Left</span>
                    <button class="keybind-btn"> <span class="key-display">A</span> </button>
                </div>
                <div class="keybind-row" data-action="moveDown">
                    <span class="action-label">Move Down</span>
                    <button class="keybind-btn"> <span class="key-display">S</span> </button>
                </div>
                <div class="keybind-row" data-action="moveRight">
                    <span class="action-label">Move Right</span>
                    <button class="keybind-btn"> <span class="key-display">D</span> </button>
                </div>
                <div class="keybind-row" data-action="ultimate">
                    <span class="action-label">Ultimate</span>
                    <button class="keybind-btn"> <span class="key-display">Q</span> </button>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button id="resetKeybinds" class="btn-secondary">Reset Defaults</button>
            <button id="closeKeybindsBtn" class="btn-primary">Done</button>
        </div>
    </div>
</div>
