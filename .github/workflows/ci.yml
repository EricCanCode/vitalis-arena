name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node.js Setup
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies (no-op allowed)
        run: |
          npm ci --no-audit --no-fund || true
      - name: Run basic scripts
        run: |
          echo "Files in repo:" && ls -la
          npm run lint
          npm test
          npm run build
